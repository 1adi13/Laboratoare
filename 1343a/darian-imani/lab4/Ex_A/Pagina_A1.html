

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Pagina A1</title>

    <style>
        p {
            color: blue;
            background-color: #cccc00;
        }

        body {
            background-color: #ffffcc;
        }

        .center, p {
            text-align: center;
            color: red;
        }

        h1 {
            background-color: #00cc66;
            color: orange;
        }

        .center {
            font-variant: small-caps;
        }
    </style>
</head>
<body>

    <h1 class="center">Heading roșu centrat</h1>

    <p>Paragraf roșu centrat</p>

    <p><a href="Pagina_A2.html">Pagina 2</a></p>

    <!--
    Exercițiul 2:
    Selectorul .center este mai specific decât selectorul h1.
    De aceea, culoarea textului din titlu este roșie,
    nu portocalie. Fundalul verde se păstrează.
    Paragraful este roșu și centrat.
    -->

</body>
</html>
